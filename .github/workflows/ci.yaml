name: Real Estate Company CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature-estate]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_FRONTEND: real-estate-company-frontend
  ECR_BACKEND: real-estate-company-backend

jobs:

  # ==========================================
  # JOB 1 - FRONTEND
  # ==========================================
  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ==========================================
  # JOB 2 - BACKEND
  # ==========================================
  backend:
    name: Backend - Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --watch=false

  # ==========================================
  # JOB 3 - SECURITY SCANNING
  # ==========================================
  security:
    name: Security - Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy installation
        run: trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

  # ==========================================
  # JOB 4 - DOCKER BUILD AND PUSH TO ECR
  # ==========================================
  publish:
    name: Docker Build and Push to ECR
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - security

    # Publish only after merging/pushing to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================
      # DEBUG GITHUB ACTIONS CONTEXT
      # ======================================
      - name: Debug GitHub Actions context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"
          echo "AWS Region: $AWS_REGION"

      - name: Verify AWS role variable
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN variable is missing"
            exit 1
          fi
          echo "AWS_ROLE_ARN variable is configured"

      # ======================================
      # DEBUG OIDC TOKEN CLAIMS
      # ======================================
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Ref: ${payload.ref}`);

      # ======================================
      # AWS AUTHENTICATION USING OIDC
      # ======================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsRealEstate

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ======================================
      # LOGIN TO AMAZON ECR
      # ======================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ======================================
      # DOCKER BUILDX
      # ======================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # BUILD AND PUSH FRONTEND
      # ======================================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}
          provenance: false

      # ======================================
      # BUILD AND PUSH BACKEND
      # ======================================
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}
          provenance: false

      # ======================================
      # PRINT IMAGE REFERENCES
      # ======================================
      - name: Print image references
        run: |
          echo "Frontend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND }}:${{ github.sha }}"

          echo "Backend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND }}:${{ github.sha }}"
